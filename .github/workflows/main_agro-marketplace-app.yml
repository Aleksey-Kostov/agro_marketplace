name: Build and Deploy Django to Render

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

jobs:
  build:
    name: Build and Check Django
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Upgrade pip
        run: |
          python -m pip install --upgrade pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Django system check
        env:
          DEBUG: "False"
          SECRET_KEY: "github-actions-test-secret-key"

          ALLOWED_HOSTS: "localhost,127.0.0.1"
          CSRF_TRUSTED_ORIGINS: ""

          DB_NAME: "test"
          DB_USER: "test"
          DB_PASSWORD: "test"
          DB_HOST: "localhost"
          DB_PORT: "5432"

          CLOUDINARY_URL: "cloudinary://test:test@test"
        run: |
          python manage.py check

      - name: Collect static files
        env:
          DEBUG: "False"
          SECRET_KEY: "github-actions-test-secret-key"

          ALLOWED_HOSTS: "localhost,127.0.0.1"
          CSRF_TRUSTED_ORIGINS: ""

          DB_NAME: "test"
          DB_USER: "test"
          DB_PASSWORD: "test"
          DB_HOST: "localhost"
          DB_PORT: "5432"

          CLOUDINARY_URL: "cloudinary://test:test@test"
        run: |
          python manage.py collectstatic --noinput


  deploy:
    name: Deploy to Render
    runs-on: ubuntu-latest

    needs: build

    # Deploy ONLY when the workflow is running
    # because of a push to main.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    permissions:
      contents: read

    steps:
      - name: Trigger Render deployment
        run: |
          curl --fail-with-body \
            -X POST \
            "${{ secrets.RENDER_DEPLOY_HOOK }}"

      - name: Deployment triggered
        run: |
          echo "Render deployment was successfully triggered."
